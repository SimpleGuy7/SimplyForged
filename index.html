<div class="hl"><h1 class="a"><b>${o.h[0]}</b> <span>${o.h[1]}</span></h1><button class="pill a" style="--d:120ms" data-sc><i>${ARW}</i>Try it now</button></div>
<div class="word" aria-hidden="true">${[...o.w].map((c,j)=>`<span style="--i:${j}">${c===' '?'&nbsp;':c}</span>`).join('')}</div></section>
<section class="calc" id="calc"><h2 class="a"><b>Try it</b> <span>with your own numbers.</span></h2>
<div class="row a" style="--d:80ms"><label><input type="number" inputmode="decimal" step="any" value="${o.v[0]}"><span>${o.f[0]}</span></label><i>${o.m}</i><label><input type="number" inputmode="decimal" step="any" value="${o.v[1]}"><span>${o.f[1]}</span></label></div>
<div class="ans a" style="--d:160ms" aria-live="polite"><small>Answer</small><b id="r"></b></div>
<h3 class="a" style="--d:200ms">How it works</h3><ol id="s" class="steps"></ol>
${o.tip?`<p class="tip a" style="--d:420ms">${o.tip}</p>`:''}
<div class="nx a" style="--d:480ms"><button class="pill" data-go="${p}"><i class="r">${ARW}</i>${ops[p].k}</button><button class="pill" data-go="${x}"><i>${ARW}</i>${ops[x].k}</button></div></section>`;
  $('pg').querySelectorAll('input').forEach(e=>e.oninput=()=>calc(0));
  calc(1);
}
function calc(anim){
  const o=ops[cur],v=[...$('pg').querySelectorAll('input')].map(e=>parseFloat(e.value));
  let out;
  if(v.some(isNaN))out={e:'Type a number in both boxes to see the answer.'};
  else out=o.run(...v);
  $('r').textContent=out.e?'—':out.r;
  $('s').className='steps'+(out.e?' e':'');
  $('s').innerHTML=(out.e?[out.e]:out.s).map((t,i)=>`<li class="${anim?'a':''}" style="--d:${240+i*90}ms">${t}</li>`).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]');
  if(b)return go(+b.dataset.go);
  if(e.target.closest('[data-sc]'))$('calc').scrollIntoView({behavior:'smooth'});
});
function start(){
  const i=ops.findIndex(o=>o.id===location.hash.slice(1));
  $('nav').innerHTML=ops.map((o,j)=>`<button data-go="${j}">${o.k}</button>`).join('');
  document.querySelector('header').classList.add('a');
  pick(i<0?0:i);
}
(function boot(){
  const t0=performance.now(),D=RM?150:1200;
  (function f(t){
    const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);
    $('pc').textContent=Math.round(e*100);$('bar').style.transform=`scaleX(${e})`;
    if(p<1)return requestAnimationFrame(f);
    $('ld').classList.add('done');start();setTimeout(()=>$('ld').remove(),1000);
  })(t0);
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
